<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sorteador de Seleções — Copa do Mundo 2026</title>
<style>
  :root{
    --ink:#f6f3ea;          /* branco quente */
    --muted:#b3b8c6;
    --gold:#e9c46a;         /* dourado do troféu */
    --gold-soft:#f0d79a;
    --line:rgba(255,255,255,.14);
    --glass:rgba(16,19,32,.55);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    color:var(--ink);
    min-height:100vh;
    display:flex;flex-direction:column;align-items:center;
    padding:44px 16px 64px;
    background:
      linear-gradient(180deg, rgba(8,10,20,.90) 0%, rgba(8,10,20,.93) 45%, rgba(8,10,20,.97) 100%),
      url('assets/background.jpg') center top / cover no-repeat fixed,
      radial-gradient(circle at 50% 0%, #1a2348 0%, #0a0e1c 60%);
  }
  h1{
    font-size:clamp(1.5rem,4vw,2.3rem);font-weight:800;letter-spacing:-.02em;text-align:center;
    color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.55);
  }
  .sub{color:var(--gold);margin-top:8px;font-size:.9rem;font-weight:600;text-align:center;
    letter-spacing:.04em;text-transform:uppercase;text-shadow:0 1px 8px rgba(0,0,0,.5);}

  .stage{
    margin-top:36px;width:min(540px,94vw);
    background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border:1px solid var(--line);border-radius:22px;
    padding:42px 24px;text-align:center;
    box-shadow:0 24px 60px rgba(0,0,0,.45);
  }
  .flag{height:96px;display:flex;align-items:center;justify-content:center;}
  .flag img{height:96px;width:auto;border-radius:8px;border:1px solid rgba(255,255,255,.25);
    box-shadow:0 10px 26px rgba(0,0,0,.5);}
  .flag .ph{height:96px;width:128px;border-radius:8px;background:rgba(255,255,255,.06);
    display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:1.8rem;}
  .name{font-size:clamp(1.4rem,5.5vw,2.2rem);font-weight:800;margin-top:20px;min-height:1.2em;letter-spacing:-.01em;}
  .name.idle{color:var(--muted);font-weight:500;font-size:1rem;}
  .winner .name{color:var(--gold-soft);text-shadow:0 0 28px rgba(233,196,106,.35);}
  .winner .flag img{animation:pop .5s ease;}
  @keyframes pop{0%{transform:scale(.5);opacity:0}60%{transform:scale(1.16)}100%{transform:scale(1)}}

  .controls{margin-top:24px;display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}
  button{
    font-family:inherit;font-weight:700;font-size:1rem;
    border-radius:12px;padding:14px 32px;cursor:pointer;border:1px solid transparent;
    transition:transform .1s,filter .15s,opacity .2s,background .15s,border-color .15s;
  }
  button:active{transform:translateY(1px);}
  .btn-go{background:linear-gradient(180deg,var(--gold-soft),var(--gold));color:#241a05;box-shadow:0 10px 26px rgba(233,196,106,.3);}
  .btn-go:hover{filter:brightness(1.06);}
  .btn-go:disabled{opacity:.4;cursor:not-allowed;box-shadow:none;filter:saturate(.4);}
  .btn-ghost{background:rgba(255,255,255,.05);color:var(--ink);border-color:var(--line);}
  .btn-ghost:hover{background:rgba(255,255,255,.12);}
  .btn-ghost:disabled{opacity:.4;cursor:not-allowed;background:rgba(255,255,255,.05);}

  .progress{margin-top:16px;font-size:.85rem;color:var(--muted);text-shadow:0 1px 6px rgba(0,0,0,.5);text-align:center;}
  .progress b{color:var(--gold);}

  /* ----- Board: 5 containers (janela rotativa de rodadas) ----- */
  .board-cap{margin-top:30px;font-size:.95rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);text-shadow:0 1px 8px rgba(0,0,0,.5);}
  .board{display:flex;gap:10px;width:min(780px,96vw);margin-top:12px;}
  .slot{
    flex:1 1 0;min-width:0;min-height:152px;
    background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    border:1px solid var(--line);border-radius:14px;
    padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:9px;text-align:center;
    transition:border-color .2s,box-shadow .2s,background .2s;
  }
  .slot .num{font-size:.7rem;font-weight:800;color:var(--muted);letter-spacing:.12em;}
  .slot .sflag{height:36px;display:flex;align-items:center;justify-content:center;}
  .slot .sflag img{height:36px;width:auto;border-radius:3px;border:1px solid rgba(255,255,255,.22);box-shadow:0 4px 10px rgba(0,0,0,.45);}
  .slot .sflag .dash{color:var(--muted);font-size:1.2rem;opacity:.5;}
  .slot .sname{font-size:.8rem;font-weight:600;line-height:1.2;color:var(--ink);word-break:break-word;}
  .slot.empty{border-style:dashed;}
  .slot.empty .sname{color:var(--muted);font-weight:400;}
  .slot.next{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 0 22px rgba(233,196,106,.22);}
  .slot.next .num{color:var(--gold);}
  .slot.anim{animation:pop .5s ease;}

  .confetti{position:fixed;top:-10px;width:8px;height:13px;pointer-events:none;z-index:50;border-radius:1px;}
  @keyframes fall{to{transform:translateY(105vh) rotate(540deg);}}
</style>
</head>
<body>
  <h1>Sorteador de Seleções</h1>
  <p class="sub">Copa do Mundo FIFA 2026 · 48 seleções</p>

  <div class="stage" id="stage">
    <div class="flag" id="flag"><div class="ph">🌐</div></div>
    <div class="name idle" id="name">Clique em “Sortear” para começar</div>
  </div>

  <div class="controls">
    <button class="btn-go" id="go">Sortear</button>
    <button class="btn-ghost" id="repeat">Repetir último</button>
    <button class="btn-ghost" id="reset">Reiniciar</button>
  </div>
  <div class="progress" id="progress"></div>

  <p class="board-cap" id="roundCap">RODADA 1</p>
  <div class="board" id="board"></div>

<script>
// Lista oficial — 48 seleções classificadas (fifa.com, Copa do Mundo 2026)
// [nome, código ISO p/ bandeira local em flags/<code>.png]
const DEFAULT = [
  ["Canadá","ca"],["México","mx"],["EUA","us"],
  ["África do Sul","za"],["Alemanha","de"],["Arábia Saudita","sa"],["Argélia","dz"],
  ["Argentina","ar"],["Austrália","au"],["Áustria","at"],["Bélgica","be"],
  ["Bósnia e Herzegovina","ba"],["Brasil","br"],["Cabo Verde","cv"],["Catar","qa"],
  ["Colômbia","co"],["Costa do Marfim","ci"],["Croácia","hr"],["Curaçau","cw"],
  ["Egito","eg"],["Equador","ec"],["Escócia","gb-sct"],["Espanha","es"],
  ["França","fr"],["Gana","gh"],["Haiti","ht"],["Holanda","nl"],
  ["Inglaterra","gb-eng"],["Iraque","iq"],["Japão","jp"],["Jordânia","jo"],
  ["Marrocos","ma"],["Noruega","no"],["Nova Zelândia","nz"],["Panamá","pa"],
  ["Paraguai","py"],["Portugal","pt"],["RD do Congo","cd"],["República da Coreia","kr"],
  ["RI do Irã","ir"],["Senegal","sn"],["Suécia","se"],["Suíça","ch"],
  ["Tchéquia","cz"],["Tunísia","tn"],["Turquia","tr"],["Uruguai","uy"],
  ["Uzbequistão","uz"]
];

const SLOT_COUNT = 5;
const PLAYERS = ["Dadau","Menezes","Erick","Mateus","Gianpaolo"];  // nome de cada container
const MAX_ROUNDS = 11;
const MAX_DRAWS = MAX_ROUNDS * SLOT_COUNT;     // 55 sorteios no total (11 rodadas × 5)
const CODES = Object.fromEntries(DEFAULT);
const $ = id => document.getElementById(id);

let teams = [];
let slots = new Array(SLOT_COUNT).fill(null);                 // seleção exibida em cada container
let history = Array.from({length:SLOT_COUNT}, ()=>new Set()); // seleções que cada container já recebeu
let last = null;                                              // {pos, prev, winner} do último sorteio (p/ repetir)
let drawIndex = 0;                                            // contador de sorteios → posição = drawIndex % 5
let spinning = false;

function flagImg(name){
  const code = CODES[name.trim()];
  if(!code) return '<div class="ph">🏳️</div>';
  return '<img src="flags/'+code+'.png" alt="">';
}
// elegíveis para um container = seleções que ELE ainda não recebeu (pode repetir em outro container)
function pool(pos){ return teams.filter(t=>!history[pos].has(t)); }
function currentRound(){ return Math.min(MAX_ROUNDS, Math.floor(drawIndex/SLOT_COUNT)+1); }
function finished(){ return drawIndex >= MAX_DRAWS; }

function loadTeams(){
  teams = DEFAULT.map(t=>t[0]);
  renderBoard(-1);
  updateProgress();
}

function renderBoard(animIndex){
  const next = drawIndex % SLOT_COUNT;
  const showNext = !finished();
  let html = '';
  for(let i=0;i<SLOT_COUNT;i++){
    const t = slots[i];
    const cls = 'slot'
      + (t ? '' : ' empty')
      + (i===next && showNext ? ' next' : '')
      + (i===animIndex ? ' anim' : '');
    const flag = t ? '<div class="sflag">'+flagImg(t)+'</div>'
                   : '<div class="sflag"><span class="dash">—</span></div>';
    const nm   = t ? '<div class="sname">'+t+'</div>'
                   : '<div class="sname">vazio</div>';
    html += '<div class="'+cls+'"><div class="num">'+PLAYERS[i]+'</div>'+flag+nm+'</div>';
  }
  $("board").innerHTML = html;
  $("roundCap").textContent = "RODADA " + currentRound();
}

function updateProgress(){
  $("repeat").disabled = spinning || !last;
  if(finished()){
    $("progress").innerHTML = "<b>Fim!</b> Rodada "+MAX_ROUNDS+" completa. Clique em Reiniciar para recomeçar.";
    $("go").disabled = true;
    return;
  }
  const nextPlayer = PLAYERS[drawIndex % SLOT_COUNT];
  $("progress").innerHTML = "Rodada <b>"+currentRound()+"</b>/"+MAX_ROUNDS+" · Próximo container → <b>"+nextPlayer+"</b>";
  $("go").disabled = spinning;
}

function spin(){
  if(spinning || finished()) return;
  const pos = drawIndex % SLOT_COUNT;
  const p = pool(pos);                          // elegíveis para ESTE container
  if(!p.length){ updateProgress(); return; }

  spinning = true;
  $("go").disabled = true;
  $("stage").classList.remove("winner");
  $("name").classList.remove("idle");

  const winner = p[Math.floor(Math.random()*p.length)];
  let elapsed = 0, delay = 50;
  const total = 2600;

  function tick(){
    const rnd = teams[Math.floor(Math.random()*teams.length)];   // visual: roda por todos
    $("flag").innerHTML = flagImg(rnd);
    $("name").textContent = rnd;
    elapsed += delay;
    if(elapsed < total){ delay *= 1.12; setTimeout(tick, delay); }
    else finish(winner);
  }
  tick();
}

function finish(winner){
  // card grande
  $("flag").innerHTML = flagImg(winner);
  $("name").textContent = winner;
  $("stage").classList.add("winner");
  spinning = false;

  // coloca no container da vez; quem estava lá já está em "out" (fica excluído de vez)
  const pos = drawIndex % SLOT_COUNT;
  last = { pos, prev: slots[pos], winner };   // guarda p/ "Repetir último"
  slots[pos] = winner;
  history[pos].add(winner);                   // esta seleção não sai mais para este container
  drawIndex++;

  renderBoard(pos);
  updateProgress();
  confetti();
}

function repeatLast(){
  if(spinning || !last) return;
  const { pos, prev, winner } = last;
  history[pos].delete(winner);   // libera a seleção que será refeita
  slots[pos] = prev;             // volta o container ao estado anterior
  drawIndex--;                   // próximo sorteio cai de novo neste container
  last = null;
  renderBoard(-1);
  spin();
}

function reset(){
  slots = new Array(SLOT_COUNT).fill(null);
  history = Array.from({length:SLOT_COUNT}, ()=>new Set());
  last = null;
  drawIndex = 0;
  spinning = false;
  $("stage").classList.remove("winner");
  $("flag").innerHTML = '<div class="ph">🌐</div>';
  $("name").className = "name idle";
  $("name").textContent = 'Clique em “Sortear” para começar';
  renderBoard(-1);
  updateProgress();
}

// confete dourado
function confetti(){
  const tones = ["#e9c46a","#f0d79a","#fff4d6","#c9a24a"];
  for(let i=0;i<55;i++){
    const c = document.createElement("div");
    c.className = "confetti";
    c.style.left = Math.random()*100 + "vw";
    c.style.background = tones[i%tones.length];
    c.style.animation = `fall ${1+Math.random()*1.3}s linear ${Math.random()*0.3}s forwards`;
    document.body.appendChild(c);
    setTimeout(()=>c.remove(), 3000);
  }
}

$("go").onclick = spin;
$("repeat").onclick = repeatLast;
$("reset").onclick = reset;

loadTeams();
</script>
</body>
</html>
